[package]
name = "glycerin"
version = "1.0.0"
edition = "2021"
description = "Glycerin Browser Engine v1.0 - Production Ready: High-performance, privacy-first browser engine built in Rust to compete with Chrome"
authors = ["Dharmendra"]
license = "MIT"
homepage = "https://glycerin.dev"
repository = "https://github.com/MrPenguinDev/glycerin"
keywords = ["browser", "web", "engine", "privacy", "performance", "rust", "gpu", "rendering"]
categories = ["web-programming", "graphics", "gui", "multimedia", "rendering"]
readme = "README.md"

[dependencies]
# Core Graphics (Vulkan + WebGPU for cross-platform)
wgpu = "0.19.3"
pollster = "0.3"

# UI Framework (Phase 1: Browser Chrome)
iced = { version = "0.13", features = ["wgpu", "tokio"] }
iced_aw = "0.10"

# HTTP types
http = "1.1"

# Networking (HTTP/3 + QUIC + HTTP/2 + HTTP/1.1)
quinn = { version = "0.10", default-features = false, features = ["rustls"] }
h3 = { version = "0.0.4", default-features = false }
h3-quinn = { version = "0.0.4", default-features = false }
rustls = "0.21.12"
reqwest = { version = "0.11", features = ["json", "stream", "cookies"] }

# JavaScript Engine (Complete Implementation)
rquickjs = { version = "0.5", features = ["macro", "loader", "parallel"] }

# IPC & Serialization
flatbuffers = { version = "23", default-features = false }
toml = { version = "0.8", default-features = false, features = ["parse"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database & Storage (Phase 2: Data Persistence)
rusqlite = { version = "0.30", features = ["bundled"] }
dirs = "5.0"

# Media Support (Phase 3: HTML5 Video/Audio)
rodio = "0.17"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# HTML Parsing & DOM (Complete Rendering)
html5ever = "0.26"
markup5ever_rcdom = "0.2"
selectors = "0.25"

# CSS Parsing & Styling
cssparser = "0.31"
fontdb = "0.16"

# GPU-Accelerated Rendering (Skia)
skia-safe = { version = "0.70", features = ["gl", "textlayout", "svg"] }

# System & Sandboxing
libc = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Font parsing for WASM text layout
ttf-parser = { version = "0.19", default-features = false }

# URL parsing
url = "2.5"

# Base64 encoding
base64 = "0.21"

# Phase 4: Security
regex = "1.10"
bitflags = "2.4"
sha2 = "0.10"

# Phase 5: Extensions (WebAssembly)
wasmtime = "17.0"
wasmparser = "0.200"
anyhow = "1.0"

# Phase 6: DevTools
uuid = { version = "1.6", features = ["v4"] }
lazy_static = "1.4"
log = "0.4"
env_logger = "0.11"

# Low-Memory Release Profile (Prevents RAM Exhaustion & Freezing)
[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = true
panic = "abort"

# Profile optimized for daily use
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

# Debug profile
[profile.dev]
opt-level = 1
debug = true
debug-assertions = false
overflow-checks = true

# Release profile for smaller binaries
[profile.release-small]
inherits = "release"
opt-level = "z"

[[bin]]
name = "glycerin"
path = "src/main.rs"
