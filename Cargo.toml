[package]
name = "glycerin"
version = "0.18.0"
edition = "2021"
description = "Glycerin Browser Engine - Complete: UI, Persistence, Media, Security, Extensions, DevTools"
authors = ["Dharmendra"]

[dependencies]
# Core Graphics (Vulkan + WebGPU for cross-platform)
wgpu = { version = "0.18", default-features = false, features = ["vulkan", "webgl"] }
pollster = "0.3"

# UI Framework (Phase 1: Browser Chrome)
iced = { version = "0.12", features = ["wgpu", "tokio"] }
iced_aw = "0.9"

# Networking (HTTP/3 + QUIC + HTTP/2 + HTTP/1.1)
quinn = { version = "0.10", default-features = false, features = ["rustls", "ring"] }
h3 = { version = "0.0.4", default-features = false }
h3-quinn = { version = "0.0.4", default-features = false }
rustls = { version = "0.21", default-features = false, features = ["ring"] }
reqwest = { version = "0.11", features = ["json", "stream", "cookies"] }

# JS Sandbox
rquickjs = { version = "0.4", default-features = false, features = ["parallel", "loader"] }

# IPC & Serialization
flatbuffers = { version = "23", default-features = false }
toml = { version = "0.8", default-features = false, features = ["parse"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database & Storage (Phase 2: Data Persistence)
rusqlite = { version = "0.30", features = ["bundled"] }
dirs = "5.0"

# Media Support (Phase 3: HTML5 Video/Audio)
rodio = "0.17"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# System & Sandboxing
libc = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Font parsing for WASM text layout
ttf-parser = { version = "0.19", default-features = false }

# URL parsing
url = "2.5"

# Base64 encoding
base64 = "0.21"

# Phase 4: Security
regex = "1.10"
bitflags = "2.4"

# Phase 5: Extensions (WebAssembly)
wasmtime = "17.0"
anyhow = "1.0"

# Phase 6: DevTools
# (serde and serde_json already included above)

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "glycerin"
path = "src/main.rs"
