[package]
name = "glycerin"
version = "0.19.0"
edition = "2021"
description = "Glycerin Browser Engine - Complete: UI, Persistence, Media, Security, Extensions, DevTools, Rendering, JS"
authors = ["Dharmendra"]

[dependencies]
# Core Graphics (Vulkan + WebGPU for cross-platform)
wgpu = { version = "0.18", default-features = false, features = ["vulkan", "webgl"] }
pollster = "0.3"

# UI Framework (Phase 1: Browser Chrome)
iced = { version = "0.12", features = ["wgpu", "tokio"] }
iced_aw = "0.9"

# Networking (HTTP/3 + QUIC + HTTP/2 + HTTP/1.1)
quinn = { version = "0.10", default-features = false, features = ["rustls", "ring"] }
h3 = { version = "0.0.4", default-features = false }
h3-quinn = { version = "0.0.4", default-features = false }
rustls = { version = "0.21", default-features = false, features = ["ring"] }
reqwest = { version = "0.11", features = ["json", "stream", "cookies"] }

# JavaScript Engine (Complete Implementation)
rquickjs = { version = "0.5", features = ["macro", "loader", "parallel"] }

# IPC & Serialization
flatbuffers = { version = "23", default-features = false }
toml = { version = "0.8", default-features = false, features = ["parse"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database & Storage (Phase 2: Data Persistence)
rusqlite = { version = "0.30", features = ["bundled"] }
dirs = "5.0"

# Media Support (Phase 3: HTML5 Video/Audio)
rodio = "0.17"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# HTML Parsing & DOM (Complete Rendering)
html5ever = "0.26"
markup5ever_rcdom = "0.2"
selectors = "0.25"

# CSS Parsing & Styling
cssparser = "0.31"
fontdb = "0.16"

# GPU-Accelerated Rendering (Skia)
skia-safe = { version = "0.70", features = ["gl", "textlayout", "svg"] }

# System & Sandboxing
libc = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Font parsing for WASM text layout
ttf-parser = { version = "0.19", default-features = false }

# URL parsing
url = "2.5"

# Base64 encoding
base64 = "0.21"

# Phase 4: Security
regex = "1.10"
bitflags = "2.4"
sha2 = "0.10"

# Phase 5: Extensions (WebAssembly)
wasmtime = "17.0"
wasmparser = "0.200"
anyhow = "1.0"

# Phase 6: DevTools
uuid = { version = "1.6", features = ["v4"] }
lazy_static = "1.4"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "glycerin"
path = "src/main.rs"
